services:
  server:
    build: .
    env_file:
      - .env
    networks:
      - breadlab-back
    deploy:
      replicas: 3
    restart: always

  breadlab-db:
    image: postgres:15-alpine
    container_name: breadlab-postgres
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always
    networks:
      - breadlab-back

  nginx:
    build: ./nginx
    container_name: breadlab-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "8888:80"
    networks:
      - breadlab-back
      - breadlab-front
    depends_on:
      - server
    restart: always

networks:
  breadlab-back:           
    external: true       

  breadlab-front:          
    external: true

volumes:
  postgres-data: