services:
  server:
    build: .
    container_name: breadlab-server
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - breadlab-net

  breadlab-db:
    image: postgres:15-alpine
    container_name: breadlab-postgres
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always
    networks:
      - breadlab-net

networks:
  breadlab-net:
    external: true

volumes:
  postgres-data: