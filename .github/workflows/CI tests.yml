name: CI

on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
      - '**.md'
  pull_request:
    branches: [ main, dev ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Check database config for branch
        run: python tests/test_db_config.py
        env:
          DB_MODE: ${{ (github.base_ref || github.ref_name) == 'main' && 'prod' || 'dev' }}
      - name: Install uv and dependencies
        run: |
          pip install uv
          uv sync
      - name: Run tests
        run: uv run pytest

